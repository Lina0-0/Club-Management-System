<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #18263d;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: white;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
            font-style: italic;
        }

        hr {
            width: 90%;
            border: none;
            height: 1px;
            background-color: #94A3B8;
        }

        label {
            font-size: 15px;
            line-height: 1.5;
        }

        .title, textarea {
            margin-left: 20px;
            color: white;
            font-size: 15px;
            width: 450px;
            height: 25px;
            padding: 10px;
            border: 2px solid #00f5ff;
            border-radius: 12px;
            background-color: rgba(0, 245, 255, 0.05);
            transition: all 0.3s ease;
        }

        .title {
            height: 25px;
        }

        textarea {
            resize: none;
            height: 350px;
        }

        input:focus, textarea:focus {
            border: 1px solid #00B8E6;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 184, 230, 0.5);
            background: #0F172A;
            transition: 0.3s;
        }

        fieldset {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0c4761, #6d9db5);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #2a596b, #024364);
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .radio-group {
            margin: 10px 0;
        }
        .radio-group label {
            margin-right: 15px;
        }

        .word-count {
            font-size: 11px;
            margin-top: 5px;
            margin-left: 20px;
            color: #94a3b8;
        }
        
        .word-count.valid {
            color: #4ecb71;
        }
        
        .word-count.invalid {
            color: #ffa500;
        }

		.error-message {
			color: #ff4444;
			font-size: 12px;
			margin-top: 5px;
			display: none;
		}
		.success-message {
			color: #4ecb71;
			font-size: 12px;
			margin-top: 5px;
			display: none;
			text-align: center;
		}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Reply to Request</title>
</head>

<body>
    <div class="container">
        <h1>Reply to Request</h1>
        <form id="replyForm">
            <fieldset>
                <legend>My reply:</legend>
                <label for="from">From:</label><br>
                <input type="text" id="from" class="title" placeholder="@Username" readonly><br><br>
                
                <label for="to">To:</label><br>
                <input type="text" id="to" class="title" placeholder="Sender username" readonly><br><br>
                
                <label>Reply to the request is:</label>
                <div class="radio-group">
                    <input type="radio" name="replyStatus" value="Approved" id="yes">
                    <label for="yes">Approved</label>
                    
                    <input type="radio" name="replyStatus" value="Rejected" id="no">
                    <label for="no">Rejected</label>
                </div>
                <br>
                
                <label for="details">Details:</label><br>
                <textarea id="details" placeholder="Explain more..."></textarea><br><br>
                <div class="word-count invalid" id="wordCount">0 / 10 words minimum</div>
				<div class="error-message" id="Error-message"></div>
				<div id="formMessage" class="success-message"></div>

            </fieldset>
            <button type="button" id="submitBtn" onclick="submitReply()">Submit</button>
        </form>
    </div>
    
    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const notifId = urlParams.get('notifId');
        const originalSender = urlParams.get('sender');
        const notifType = urlParams.get('type');
        console.log('notifType from URL:', notifType);
        console.log('isJoinRequest?', notifType && notifType.toLowerCase().includes('join'));
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        
        if (currentUser) {
            document.getElementById('from').value = currentUser.username;
        }
        
        if (originalSender) {
            document.getElementById('to').value = decodeURIComponent(originalSender);
        }

        function countWords(text) {
            if (!text) return 0;
            return text.trim().split(/\s+/).filter(word => word.length > 0).length;
        }

        const detailsTextarea = document.getElementById('details');
        const wordCountSpan = document.getElementById('wordCount');
        const submitBtn = document.getElementById('submitBtn');

        function updateWordCount() {
    const text = detailsTextarea.value;
    const wordCount = countWords(text);
    
    wordCountSpan.textContent = `${wordCount} / 10 words minimum`;
    
    if (wordCount >= 10) {
        wordCountSpan.className = 'word-count valid';
        if (submitBtn) submitBtn.disabled = false;
    } else {
        wordCountSpan.className = 'word-count invalid';
        if (submitBtn) submitBtn.disabled = true;
    }
}
        
        detailsTextarea.addEventListener('input', updateWordCount);
        
        async function submitReply() {
            
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            const replyStatus = document.querySelector('input[name="replyStatus"]:checked');
            const details = document.getElementById('details').value;
            const wordCount = countWords(details);
            
            if (!replyStatus) {
                alert('Please select Approved or Rejected');
                return;
            }
            
            if (wordCount < 10) {
                alert(`Please provide at least 10 words (currently ${wordCount} words)`);
                return;
            }
            
            const replyData = {
                originalNotificationId: notifId,
                fromUsername: from,
                toUsername: to,
                replyStatus: replyStatus.value,
                details: details,
                originalSender: to,
                originalType: notifType
            };
            
            try {
            const isJoinRequest = notifType && notifType.toLowerCase() === 'join request';
    
            const apiEndpoint = isJoinRequest ? '/api/submit-reply' : '/api/reply-request';
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(replyData)
                });
                
                const result = await response.json();
				const messageDiv = document.getElementById('Error-message');
				messageDiv.style.display = 'block';
                
                if (result.success) {
				messageDiv.style.color = '#4ecb71';
				messageDiv.innerHTML = '✅ Reply sent successfully' ;
				setTimeout(() => {
					if (window.parent && window.parent.closePanel) {
						window.parent.closePanel();
					}}, 1000);
					} else {
						messageDiv.style.color = '#ff4444';
						messageDiv.innerHTML = '❌ Something went wrong';
					}
					} catch (error) {
						console.error('Error submitting reply:', error);
						alert('Failed to send reply');
					}
				}
    </script>
</body>
</html>
