<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Catalyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0b1421 0%, #020617 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass-card p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-cyan-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-lock text-3xl text-cyan-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Reset Password</h1>
            <p class="text-gray-400 text-sm mt-2">Enter your new password below</p>
        </div>
        
        <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm"></div>
        <div id="successMessage" class="hidden bg-green-500/20 border border-green-500/30 text-green-400 px-4 py-3 rounded-lg mb-4 text-sm"></div>
        
        <form id="resetForm">
            <div class="mb-4">
                <label class="block text-gray-300 text-sm font-medium mb-2">
                    <i class="fa-solid fa-key mr-2"></i> New Password
                </label>
                <input type="password" id="newPassword" required 
                       class="w-full px-4 py-3 bg-white/5 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white">
                <p class="text-xs text-gray-500 mt-1">At least 8 characters with at least one letter and one number</p>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-300 text-sm font-medium mb-2">
                    <i class="fa-solid fa-key mr-2"></i> Confirm New Password
                </label>
                <input type="password" id="confirmPassword" required 
                       class="w-full px-4 py-3 bg-white/5 border border-gray-600 rounded-lg focus:border-cyan-400 focus:outline-none text-white">
            </div>
            
            <button type="submit" id="submitBtn" 
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-[1.02]">
                <i class="fa-solid fa-rotate-right mr-2"></i> Reset Password
            </button>
        </form>
        
        <div class="text-center mt-6">
            <a href="index.html" class="text-cyan-400 hover:text-cyan-300 text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
            </a>
        </div>
    </div>
    
    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userId = urlParams.get('user');
        
        if (!token || !userId) {
            document.getElementById('errorMessage').textContent = 'Invalid reset link. Please request a new password reset.';
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('resetForm').style.display = 'none';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('successMessage').classList.add('hidden');
            
            if (newPassword !== confirmPassword) {
                document.getElementById('errorMessage').textContent = 'Passwords do not match';
                document.getElementById('errorMessage').classList.remove('hidden');
                return;
            }
            
            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
            if (!passwordRegex.test(newPassword)) {
                document.getElementById('errorMessage').textContent = 'Password must be at least 8 characters with at least one letter and one number';
                document.getElementById('errorMessage').classList.remove('hidden');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Resetting...';
            
            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        userId: userId,
                        newPassword: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('successMessage').textContent = data.message;
                    document.getElementById('successMessage').classList.remove('hidden');
                    document.getElementById('resetForm').style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 60000);
                } else {
                    document.getElementById('errorMessage').textContent = data.message;
                    document.getElementById('errorMessage').classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-rotate-right mr-2"></i> Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('errorMessage').textContent = 'An error occurred. Please try again.';
                document.getElementById('errorMessage').classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-rotate-right mr-2"></i> Reset Password';
            }
        });
    </script>
</body>
</html>
