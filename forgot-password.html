<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password - Catalyst</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
            
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
                min-height: 100vh;
            }

            .glass-card {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }

            .input-glow:focus {
                box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
            }

            .btn-shimmer {
                position: relative;
                overflow: hidden;
            }
            .btn-shimmer::after {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
                transform: rotate(45deg);
                transition: 0.5s;
            }
            .btn-shimmer:hover::after {
                left: 120%;
            }
            
            .reset-link-box {
                background: rgba(0, 212, 255, 0.1);
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 15px;
                margin: 20px 0;
                word-break: break-all;
            }
            
            .reset-link-box a {
                color: #00d4ff;
                text-decoration: none;
                font-size: 12px;
                transition: all 0.3s;
            }
            
            .reset-link-box a:hover {
                text-decoration: underline;
                color: #4ecb71;
            }
            
            .copy-btn {
                background: rgba(0, 212, 255, 0.2);
                border: 1px solid rgba(0, 212, 255, 0.3);
                padding: 8px 16px;
                border-radius: 8px;
                font-size: 12px;
                cursor: pointer;
                transition: all 0.3s;
            }
            
            .copy-btn:hover {
                background: rgba(0, 212, 255, 0.4);
                transform: scale(1.02);
            }
        </style>
    </head>

    <body class="flex items-center justify-center p-4">
        <div class="glass-card p-10 w-full max-w-md rounded-2xl transition-all duration-500" id="mainContainer">
            <div id="formContent">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-gradient-to-tr from-cyan-500/20 to-blue-500/20 rounded-2xl flex items-center justify-center mx-auto mb-6 transform rotate-3">
                        <i class="fa-solid fa-shield-halved text-4xl text-cyan-400"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white tracking-tight">Recover Access</h1>
                    <p class="text-gray-400 mt-3">Enter your credentials to reset password</p>
                </div>
                
                <div id="errorMessage" class="hidden animate-pulse bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm"></div>
                
                <form id="forgotForm" class="space-y-5">
                    <div>
                        <label class="block text-gray-400 text-xs uppercase tracking-widest font-semibold mb-2 ml-1">
                            Username
                        </label>
                        <input type="text" id="username" required placeholder="@username" class="w-full px-4 py-4 bg-white/5 border border-white/10 rounded-xl focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 focus:outline-none text-white transition-all input-glow">
                    </div>
                    
                    <div>
                        <label class="block text-gray-400 text-xs uppercase tracking-widest font-semibold mb-2 ml-1">
                            Email Address
                        </label>
                        <input type="email" id="email" required placeholder="name@company.com" class="w-full px-4 py-4 bg-white/5 border border-white/10 rounded-xl focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 focus:outline-none text-white transition-all input-glow">
                    </div>
                    
                    <button type="submit" id="submitBtn" class="btn-shimmer w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-cyan-500/20 active:scale-95">
                        <span id="btnText">Send Recovery Link</span>
                    </button>
                </form>
            </div>

            <div id="successContent" class="hidden text-center py-4">
                <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-link text-3xl text-green-400"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-3">Reset Link Ready</h2>
                <p class="text-gray-400 mb-4">Click the link below to reset your password:</p>
                
                <div class="reset-link-box">
                    <a id="resetLink" href="#" target="_blank" class="text-sm break-all"></a>
                </div>
                
                <button onclick="copyResetLink()" class="copy-btn text-cyan-400 mb-4">
                    <i class="fa-solid fa-copy mr-2"></i> Copy Link
                </button>
                
                <p class="text-gray-500 text-xs mt-2">⚠️ This link expires in 1 hour</p>

                <button onclick="window.location.href='index.html'" 
                        class="text-gray-300 hover:text-white text-sm font-medium transition mt-4 block w-full">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Return to login
                </button>
            </div>
            
            <div id="footerLinks" class="text-center mt-8 pt-6 border-t border-white/5">
                <a href="index.html" class="text-gray-500 hover:text-cyan-400 text-sm transition transition-colors">
                    Remember your password? <span class="text-cyan-400 font-semibold underline underline-offset-4">Log in</span>
                </a>
            </div>
        </div>
    </body>

    <script>
        let currentResetLink = '';
        
        function copyResetLink() {
            navigator.clipboard.writeText(currentResetLink);
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Copied!';
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
            }, 2000);
        }
        
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Verifying...';
            
            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });
                
                const data = await response.json();
                
                if (data.success && data.resetLink) {
                    currentResetLink = data.resetLink;
                    document.getElementById('resetLink').href = currentResetLink;
                    document.getElementById('resetLink').textContent = currentResetLink;
                    
                    document.getElementById('formContent').classList.add('hidden');
                    document.getElementById('footerLinks').classList.add('hidden');
                    
                    const successDiv = document.getElementById('successContent');
                    successDiv.classList.remove('hidden');
                } else {
                    throw new Error(data.message || 'Invalid credentials');
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.textContent = 'Send Recovery Link';
            }
        });
    </script>
</html>
